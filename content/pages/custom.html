<div class="custom-demo" style="border:1px dashed rgba(128,128,128,.4);border-radius:12px;padding:20px;margin-bottom:18px">
  <h3 style="margin-top:0">这是自定义 HTML 页面</h3>
  <p>本页面由 <code>content/pages/custom.html</code> 提供，内容原样透传，不会被 Markdown 解析，可自由嵌入任意 HTML / 样式 / 脚本。</p>
  <ul>
    <li>支持在 front matter 中定义 <code>title / date</code> 等元数据</li>
    <li>也可以写 Markdown 文件并在 front matter 里标记 <code>raw: true</code> 实现同样效果</li>
  </ul>
</div>

<p>此页面用于演示「自定义 HTML 页面」功能：完整掌控布局与交互，适合落地页、活动页、工具页等场景。</p>
