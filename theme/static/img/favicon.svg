<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c8c8"/>
      <stop offset="0.55" stop-color="#e7a8bd"/>
      <stop offset="1" stop-color="#b98cc9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1dbe4"/>
    </linearGradient>
  </defs>
  <!-- 圆角底 -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- 顶部高光 -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.6"/>
  <!-- 双环 O 字: 渐变环 -->
  <circle cx="32" cy="33" r="15.5" fill="none" stroke="url(#ring)" stroke-width="5.2"/>
  <!-- 内环负空间 -->
  <circle cx="32" cy="33" r="9" fill="none" stroke="rgba(185,140,201,.45)" stroke-width="1.4" stroke-dasharray="2.8 2.8"/>
  <!-- 右上星光 -->
  <circle cx="47.5" cy="17.5" r="2.6" fill="#fff" opacity=".92"/>
  <circle cx="47.5" cy="17.5" r="5.2" fill="none" stroke="#fff" stroke-width="1" opacity=".35"/>
</svg>