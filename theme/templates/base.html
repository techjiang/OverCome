<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{site_title}}</title>
<meta name="description" content="{{description}}">
{{seo_head}}
<link rel="alternate" type="application/atom+xml" title="{{site_title}} RSS" href="{{root}}feed.xml">
<link rel="icon" href="{{root}}static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{root}}static/css/style.css?v={{assets_version}}">
<link rel="stylesheet" href="{{root}}static/css/viewer.css?v={{assets_version}}">
<style>:root{--right-bar-width:{{right_w}}px}</style>
<script>
  (function () {
    var saved = localStorage.getItem('overcome-theme');
    var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.classList.add('dark');
  })();
</script>
{{extra_head}}
</head>
<body>
<a class="skip-link" href="#main">跳到内容</a>
<div class="progress-bar" id="progress-bar" aria-hidden="true"><span></span></div>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <a class="brand-link" href="{{root}}">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">
          <b>{{site_title}}</b>
          <i>{{subtitle}}</i>
        </span>
      </a>
    </div>
    <nav class="nav" aria-label="主导航">{{nav}}</nav>
    {{side_toc}}
    <div class="sidebar-foot">
      {{social}}
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="切换深色模式">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
        <span>深色模式</span>
      </button>
      {{analytics}}
      <p class="copyright">© {{site_year}} {{site_author}}</p>
    </div>
  </aside>
<div class="content">
      <header class="mobile-bar">
        <a class="brand-link mobile-brand" href="{{root}}">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text"><b>{{site_title}}</b></span>
        </a>
        <button class="menu-toggle" id="menu-toggle" type="button" aria-label="打开菜单" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </header>
      <div class="content-grid">
        <main id="main" class="main">{{content}}</main>
        {{right_bar}}
      </div>
      <footer class="mobile-foot">
        <p class="copyright">© {{site_year}} {{site_author}}</p>
      </footer>
    </div>
</div>
<button class="back-to-top" id="back-to-top" type="button" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
<script src="{{root}}static/js/main.js?v={{assets_version}}" defer></script>
<script src="{{root}}static/js/viewer.js?v={{assets_version}}" defer></script>
<script src="{{root}}static/js/seal.js?v={{assets_version}}" defer></script>
</body>
</html>
